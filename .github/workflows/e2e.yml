name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep E2E cache state separate from the ordinary unit/verify cache. A
  # passing static gate must never imply that a real Postgres path passed.
  e2e-cache-check:
    name: E2E cache check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hit: ${{ steps.lookup.outputs.cache-hit }}
      hash: ${{ steps.compute.outputs.hash }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Compute content hash
        id: compute
        run: |
          HASH=$(bash scripts/ci-cache-hash.sh --verbose 2>/tmp/e2e-cache-diag)
          cat /tmp/e2e-cache-diag
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
      - name: Lookup E2E pass marker
        id: lookup
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          key: e2e-pass-${{ steps.compute.outputs.hash }}
          path: .e2e-cache-marker
          lookup-only: true

  jsonb-parity:
    name: Postgres JSONB parity
    needs: e2e-cache-check
    if: needs.e2e-cache-check.outputs.hit != 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Run JSONB parity files through the E2E wrapper
        run: bash scripts/run-e2e.sh test/e2e/postgres-jsonb.test.ts test/e2e/jsonb-roundtrip.test.ts test/phantom-redirect-engine-parity.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test

  tier1:
    name: Tier 1 (Mechanical)
    needs: e2e-cache-check
    if: needs.e2e-cache-check.outputs.hit != 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Run Tier 1 E2E files sequentially
        run: bash scripts/run-e2e.sh test/e2e/mechanical.test.ts test/e2e/mcp.test.ts test/e2e/advisor-mcp-postgres.test.ts test/e2e/quick-maintenance-postgres.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test

  tier2:
    name: Tier 2 (LLM Skills)
    needs: [e2e-cache-check, jsonb-parity]
    if: needs.e2e-cache-check.outputs.hit != 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Install OpenClaw with bounded retries
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if timeout 120 npm install -g openclaw@2026.4.9; then
              exit 0
            fi
            echo "OpenClaw install attempt $attempt failed; retrying" >&2
            sleep 10
          done
          exit 1
      - name: Configure OpenClaw MCP
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test
        run: |
          mkdir -p ~/.openclaw
          cat > ~/.openclaw/config.json <<EOF
          {
            "mcpServers": {
              "gbrain": {
                "command": "bun",
                "args": ["run", "src/cli.ts", "serve"],
                "env": {
                  "DATABASE_URL": "$DATABASE_URL"
                }
              }
            }
          }
          EOF
      # OpenClaw resolves its client configuration from the runner HOME, so
      # this is the one explicit direct-Bun exception to the wrapper. The
      # database name is still test-shaped and the preload allow is scoped to
      # this job only; no workflow/global allow variable is set.
      - name: Run Tier 2 skill tests
        run: |
          for file in test/e2e/skills.test.ts test/e2e/zeroentropy-live.test.ts; do
            echo "=== $file ==="
            timeout 720 bun test --timeout=60000 "$file"
          done
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test
          GBRAIN_TEST_ALLOW_DATABASE_URL: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZEROENTROPY_API_KEY: ${{ secrets.ZEROENTROPY_API_KEY }}

  e2e-cache-write:
    name: Write E2E pass marker
    needs: [e2e-cache-check, jsonb-parity, tier1, tier2]
    if: success() && needs.e2e-cache-check.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create cache marker
        run: |
          mkdir -p .e2e-cache-marker
          echo "${{ needs.e2e-cache-check.outputs.hash }}" > .e2e-cache-marker/hash
          echo "$GITHUB_SHA" > .e2e-cache-marker/sha
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          key: e2e-pass-${{ needs.e2e-cache-check.outputs.hash }}
          path: .e2e-cache-marker

  e2e-status:
    name: E2E status
    needs: [e2e-cache-check, jsonb-parity, tier1, tier2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate result
        env:
          CACHE_RESULT: ${{ needs.e2e-cache-check.result }}
          CACHE_HIT: ${{ needs.e2e-cache-check.outputs.hit }}
          JSONB: ${{ needs.jsonb-parity.result }}
          TIER1: ${{ needs.tier1.result }}
          TIER2: ${{ needs.tier2.result }}
          FORCE_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          echo "cache-result=$CACHE_RESULT cache-hit=$CACHE_HIT jsonb=$JSONB tier1=$TIER1 tier2=$TIER2 force=$FORCE_RUN"
          if [ "$CACHE_RESULT" != "success" ]; then
            echo "E2E cache check did not succeed: $CACHE_RESULT" >&2
            exit 1
          fi
          if [ "$CACHE_HIT" = "true" ] && [ "$FORCE_RUN" != "true" ]; then
            echo "E2E cache hit — previously completed E2E contract is green."
            exit 0
          fi
          for result in "$JSONB" "$TIER1" "$TIER2"; do
            if [ "$result" != "success" ]; then
              echo "E2E gate did not succeed: $result" >&2
              exit 1
            fi
          done
          echo "E2E parity and tiered tests are green."
