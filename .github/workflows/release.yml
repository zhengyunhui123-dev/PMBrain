name: Release

on:
  push:
    tags: ['v*']
  # Manual runs validate the Windows package without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            build_script: build:win
            artifact_paths: |
              desktop/dist/PMBrain-Windows-x64-Setup-*.exe
              desktop/dist/PMBrain-Windows-x64-Setup-*.exe.blockmap
              desktop/dist/latest.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.14
      # A manual run is a pre-release validation on a branch/commit, so it
      # has no release tag to compare. Tag pushes keep the strict check.
      - name: Verify desktop version matches tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun -e "const pkg = await Bun.file('desktop/package.json').json(); if ('v' + pkg.version !== process.env.RELEASE_TAG) throw new Error('desktop version ' + pkg.version + ' does not match tag ' + process.env.RELEASE_TAG)"
      - run: bun install --frozen-lockfile
      - name: Install Admin dependencies
        working-directory: admin
        run: bun install --frozen-lockfile
      # The full suite is already enforced by the master Test workflow with
      # the optimized 10-shard layout. Keep the release preflight on the
      # remaining Windows build instead of repeating it per platform.
      - name: Run release preflight checks
        run: bun run verify
      - run: bun run build:admin
      - name: Verify generated Admin and release files are committed
        shell: pwsh
        run: |
          git diff --exit-code -- admin/dist src/admin-embedded.ts release-manifest.json
          if ($LASTEXITCODE -ne 0) {
            throw "Generated files are stale. Run 'bun run build:admin' and commit admin/dist, src/admin-embedded.ts, and release-manifest.json."
          }
      - name: Verify release notes source
        shell: pwsh
        run: |
          $releaseNotesPath = 'desktop/build/release-notes.md'
          if (-not (Test-Path -LiteralPath $releaseNotesPath)) { throw "Missing $releaseNotesPath" }
          if ([string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $releaseNotesPath -Raw -Encoding UTF8))) { throw "Empty $releaseNotesPath" }
      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --trust
      - name: Verify desktop runtime compatibility code
        working-directory: desktop
        run: |
          bun run typecheck
          bun test test/runtime-compatibility.test.ts test/package-version-contract.test.ts
      - name: Build and verify ${{ matrix.platform }} desktop package
        working-directory: desktop
        run: bun run ${{ matrix.build_script }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pmbrain-desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_paths }}

  release:
    # workflow_dispatch is intentionally a build-only dry run. Publishing is
    # reserved for an explicit v* tag push.
    if: github.event_name == 'push'
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2
        with:
          files: |
            artifacts/pmbrain-desktop-windows/PMBrain-Windows-x64-Setup-*.exe
            artifacts/pmbrain-desktop-windows/PMBrain-Windows-x64-Setup-*.exe.blockmap
            artifacts/pmbrain-desktop-windows/latest.yml
          body_path: desktop/build/release-notes.md

  published-upgrade-e2e:
    name: Published Windows upgrade preserves PGLite data
    if: github.event_name == 'push'
    needs: [release]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Find and download previous Windows installer
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'PMBrain-release-upgrade-e2e' }
          $releases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=30"
          $previous = $releases | Where-Object { -not $_.draft -and $_.tag_name -ne $env:CURRENT_TAG } | Select-Object -First 1
          if (-not $previous) {
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $asset = $previous.assets | Where-Object { $_.name -match '^PMBrain-Windows-x64-Setup-.*\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw "Previous release $($previous.tag_name) has no Windows NSIS installer" }
          $downloadDir = Join-Path $env:RUNNER_TEMP 'pmbrain-previous-release'
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $target = Join-Path $downloadDir $asset.name
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $target
          "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Install release UI driver
        if: steps.previous.outputs.found == 'true'
        run: python -m pip install -r test/user-journeys/requirements.txt
      - name: Run published updater journey
        if: steps.previous.outputs.found == 'true'
        shell: pwsh
        env:
          OLD_INSTALLER: ${{ steps.previous.outputs.installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath 'desktop/package.json' -Raw -Encoding UTF8 | ConvertFrom-Json).version
          python test/user-journeys/release_upgrade_journey.py `
            --old-installer $env:OLD_INSTALLER `
            --expected-version $version `
            --artifacts-dir (Join-Path $env:RUNNER_TEMP 'pmbrain-release-upgrade')
      - name: Explain first-release skip
        if: steps.previous.outputs.found != 'true'
        run: echo "No previous Windows release exists; the cross-version updater journey is not applicable yet."
      - name: Upload upgrade evidence
        if: always() && steps.previous.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pmbrain-published-upgrade-e2e
          path: ${{ runner.temp }}/pmbrain-release-upgrade/
          if-no-files-found: warn
